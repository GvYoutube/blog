---
layout: default
title: Article
---

<article class="post" aria-live="polite">
  <header class="post-header">
    <h1 class="post-title" id="article-title">Loading article...</h1>
  </header>
  <div class="post-content" id="article-content">
    <p>Reading Markdown.</p>
  </div>
</article>

<script>
  const titleElement = document.getElementById('article-title');
  const contentElement = document.getElementById('article-content');

  function escapeHtml(value) {
    return value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function renderInline(value) {
    let rendered = escapeHtml(value);
    rendered = rendered.replace(/`([^`]+)`/g, '<code>$1</code>');
    rendered = rendered.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" rel="noopener noreferrer">$1</a>');
    rendered = rendered.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    rendered = rendered.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return rendered;
  }

  function renderMarkdown(markdown) {
    const lines = markdown.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
    const output = [];

    for (let i = 0; i < lines.length;) {
      const line = lines[i];

      if (!line.trim()) {
        i++;
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.+)$/);
      if (heading) {
        const level = heading[1].length;
        output.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
        i++;
        continue;
      }

      if (/^```/.test(line.trim())) {
        const language = line.trim().slice(3).trim();
        i++;
        const code = [];
        while (i < lines.length && !/^```/.test(lines[i].trim())) code.push(lines[i++]);
        if (i < lines.length) i++;
        const className = /^[a-z0-9_-]+$/i.test(language) ? ` class="language-${escapeHtml(language)}"` : '';
        output.push(`<pre><code${className}>${escapeHtml(code.join('\n'))}</code></pre>`);
        continue;
      }

      if (/^[-*]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
          items.push(`<li>${renderInline(lines[i].replace(/^[-*]\s+/, ''))}</li>`);
          i++;
        }
        output.push(`<ul>${items.join('')}</ul>`);
        continue;
      }

      if (/^\d+[.)]\s+/.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+[.)]\s+/.test(lines[i])) {
          items.push(`<li>${renderInline(lines[i].replace(/^\d+[.)]\s+/, ''))}</li>`);
          i++;
        }
        output.push(`<ol>${items.join('')}</ol>`);
        continue;
      }

      if (/^>\s?/.test(line)) {
        const quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        output.push(`<blockquote>${renderInline(quote.join(' '))}</blockquote>`);
        continue;
      }

      const paragraph = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^```|^[-*]\s+|^\d+[.)]\s+|^>\s?/.test(lines[i])) {
        paragraph.push(lines[i]);
        i++;
      }
      output.push(`<p>${renderInline(paragraph.join(' '))}</p>`);
    }

    return output.join('\n');
  }

  async function loadArticle() {
    const slug = new URLSearchParams(window.location.search).get('article');

    if (!slug || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
      titleElement.textContent = 'Article not found';
      contentElement.innerHTML = '<p>Choose an article from the <a href="{{ site.baseurl }}/">article list</a>.</p>';
      return;
    }

    try {
      const response = await fetch(`{{ site.baseurl }}/articles/${encodeURIComponent(slug)}.md`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Article returned ${response.status}`);

      const markdown = await response.text();
      const lines = markdown.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
      const firstHeading = lines.find((line) => /^#\s+/.test(line));
      const title = firstHeading ? firstHeading.replace(/^#\s+/, '') : slug;

      titleElement.textContent = title;
      document.title = `${title} | {{ site.title }}`;
      contentElement.innerHTML = renderMarkdown(markdown);
    } catch (error) {
      titleElement.textContent = 'Article not found';
      contentElement.innerHTML = '<p>That article could not be loaded. Return to the <a href="{{ site.baseurl }}/">article list</a>.</p>';
      console.error(error);
    }
  }

  loadArticle();
</script>
