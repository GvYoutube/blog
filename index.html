---
layout: default
title: Articles
---

<section class="article-list" aria-labelledby="article-list-heading">
  <h1 id="article-list-heading">Articles</h1>
  <div id="articles" aria-live="polite">Loading articles...</div>
  <noscript>This article index requires JavaScript.</noscript>
</section>

<script>
  function parseArticleDate(value) {
    if (!value) return null;

    const text = String(value).trim();
    const iso = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) {
      if (Number(iso[2]) <= 12) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]), 0, 0, 0);
      if (Number(iso[2]) <= 31 && Number(iso[3]) <= 12) return new Date(Number(iso[1]), Number(iso[3]) - 1, Number(iso[2]), 0, 0, 0);
    }

    const slash = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
    if (slash) {
      let year = Number(slash[3]);
      if (year < 100) year += year >= 70 ? 1900 : 2000;
      const first = Number(slash[1]);
      const second = Number(slash[2]);
      if (first <= 12) return new Date(year, first - 1, second, 0, 0, 0);
      if (second <= 12) return new Date(year, second - 1, first, 0, 0, 0);
    }

    const separated = text.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{4})$/);
    if (separated) {
      const first = Number(separated[1]);
      const second = Number(separated[2]);
      const year = Number(separated[3]);
      if (first <= 31 && second <= 12) return new Date(year, second - 1, first, 0, 0, 0);
    }

    return null;
  }

  async function loadArticles() {
    const container = document.getElementById('articles');

    try {
      const response = await fetch('{{ site.baseurl }}/articles/index.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Article index returned ${response.status}`);

      const articles = await response.json();
      if (!Array.isArray(articles) || articles.length === 0) {
        container.textContent = 'No articles yet.';
        return;
      }

      container.replaceChildren();
      const list = document.createElement('ul');
      list.className = 'post-list';

      for (const article of articles.sort((a, b) => (parseArticleDate(b.date)?.getTime() || 0) - (parseArticleDate(a.date)?.getTime() || 0))) {
        if (!article.slug || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(article.slug)) continue;

        const item = document.createElement('li');
        const heading = document.createElement('h2');
        const link = document.createElement('a');
        link.className = 'post-link';
        link.href = `{{ site.baseurl }}/article.html?article=${encodeURIComponent(article.slug)}`;
        link.textContent = article.title || article.slug;
        heading.appendChild(link);

        const meta = document.createElement('span');
        meta.className = 'post-meta';
        const parsedDate = parseArticleDate(article.date);
        meta.textContent = parsedDate ? parsedDate.toLocaleDateString() : (article.date || '');

        item.append(meta, heading);
        if (article.description) {
          const description = document.createElement('p');
          description.textContent = article.description;
          item.appendChild(description);
        }
        list.appendChild(item);
      }

      container.appendChild(list);
    } catch (error) {
      container.textContent = 'Could not load the article index.';
      console.error(error);
    }
  }

  loadArticles();
</script>
